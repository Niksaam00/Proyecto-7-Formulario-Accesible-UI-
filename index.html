<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar perfil</title>
    <link rel="stylesheet" href=".//assets/css/style.css">
</head>

<body>

    <main>

        <section>

            <div class="columnaFormulario">

                <form action="#" method="post">

                    <div class="campo">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Nicolas David Saavedra"
                            autocomplete="name">
                    </div>

                    <div class="campo">
                        <label for="email">Email</label>
                        <input class="error" type="email" id="email" name="email" placeholder="john@gamil.com"
                            value="john@gmail.com" aria-describedby="mensaje-error">
                        <small id="mensajeError" class="mensajeError">
                            Email ya existente
                        </small>
                    </div>

                    <div class="campo">
                        <label for="password">Ingresar Contraseña</label>
                        <div class="campoPassword">
                            <input type="password" id="password" name="password" placeholder="xxxxxxxx"
                                autocomplete="new-password">
                            <span class="ojo" aria-hidden="true">●</span>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="confirmar">Confirmacion contraseña</label>
                        <div class="campoPassword">
                            <input type="password" id="confirmar" name="confirmar" placeholder="xxxxxxxx"
                                autocomplete="new-password">
                            <span class="ojo" aria-hidden="true">●</span>
                        </div>
                    </div>

                    <button type="submit">Enviar datos</button>

                </form>

            </div>

            <aside class="columnaProgreso">

                <div class="circulo">
                    <span>65%</span>
                </div>

                <p class="tituloProgreso">
                    Progreso hasta el momento 
                </p>

                <div class="listaTareas">
                    <p class="completada">Crear cuenta </p>
                    <p class="completada">Escoger terminos</p>
                    <p class="completada">Llenar formulario</p>
                    <p>Invitar Amigos</p>
                    <p>Hacer el primer abono</p>
                </div>

            </aside>

        </section>

    </main>

</body>

</html>
